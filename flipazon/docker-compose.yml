services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: flipazon
      POSTGRES_PASSWORD: local_dev_only_change_me
      POSTGRES_DB: flipazon
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - flipazon_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flipazon -d flipazon"]
      interval: 5s
      timeout: 3s
      retries: 15
volumes:
  flipazon_pg_data:
